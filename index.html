<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="refresh" content="10;url=https://www.azurlaneecgc.com/">
  <script>
    const redirectUrl = "https://www.azurlaneecgc.com/";
    let seconds = 10;

    function updateCountdown() {
      const countdown = document.getElementById("countdown");
      countdown.textContent = seconds;
      if (seconds > 0) {
        seconds--;
      } else {
        window.location.replace(redirectUrl);
      }
    }

    // Initialize countdown and update every second
    window.onload = () => {
      updateCountdown();
      setInterval(updateCountdown, 1000);
    };
  </script>
</head>
<body>
  <h1>
    Redirecting to 
    <a href="https://www.azurlaneecgc.com/" rel="noopener noreferrer">
      https://www.azurlaneecgc.com/
    </a>
    in <span id="countdown">10</span> seconds…
  </h1>
</body>
</html>
